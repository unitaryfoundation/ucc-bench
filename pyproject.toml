[project]
name = "ucc-bench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Brad Chase", email = "brad@unitary.foundation" },
    { name = "Jordan Sullivan", email = "jordan@unitary.foundation" }
]
requires-python = ">=3.12"
dependencies = [
    "cirq>=1.4.1",
    "psutil>=7.0.0",
    "pydantic>=2.13.2",
    "pytket>=2.0.1",
    "qbraid>=0.9.10",
    "qiskit-aer>=0.17.0",
    "qiskit>=2.4.0",
    "ucc>=0.4.3",
    "pandas>=2.2.3",
    "tabulate>=0.9.0",
    "adjusttext>=1.3.0",
    "qiskit-ibm-runtime>=0.40.1",
    "seaborn>=0.13.2",
    "tomlkit>=0.13.3",
    "mqt-bench>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "ruff>=0.15.10",
]

[tool.uv.sources]
ucc = { git = "https://github.com/unitaryfoundation/ucc", rev = "2b88574946bdd4977240d257deb62f88ed9eeafa" }
[project.scripts]
ucc-bench = 'ucc_bench.main:main'

[tool.pytest.ini_options]
pythonpath = ["src"]
